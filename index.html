<!DOCTYPE html>
<html>
<head>
    <title>💌 A Special Question For You 💌</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;

            background: url("white-grid-math-paper-wrinkled-texture-background-rough-surface-pattern-graph-paper-white-grid-math-paper-wrinkled-texture-137375504.webp");
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
        }

        .header {
            background: #FF1493;
            padding: 25px;
            color: white;
            font-size: 20px;
        }

        .container {
            background: rgba(255, 229, 236, 0.95);
            margin: 60px auto;
            padding: 40px;
            border-radius: 20px;
            width: 80%;
            max-width: 700px;
            position: relative;
        }

        h1 {
            color: #C71585;
            margin-bottom: 10px;
        }

        p {
            color: #FF69B4;
            font-style: italic;
        }

        button {
            border: none;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s ease;
        }

        #yesBtn {
            background: #FF1493;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            margin-top: 40px;
        }

        #yesBtn:hover {
            background: #ff2f9e;
        }

        #noBtn {
            background: #FFB6C1;
            padding: 10px 25px;
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            top: 220px;
        }

        #loveBox {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #FFE5EC;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 30px rgba(255, 20, 147, 0.6);
            width: 80%;
            max-width: 500px;
            z-index: 1000;
        }

        #loveBox h2 {
            color: #C71585;
        }

        #loveBox button {
            background: #FF1493;
            color: white;
            padding: 12px 30px;
            margin-top: 20px;
        }

        #loveBox button:hover {
            background: #ff2f9e;
        }
    </style>
</head>

<body>

    <div class="header">
        💖 ✨ 💕 ✨ 💖 ✨ 💕 ✨ 💖
    </div>

    <div class="container">
        <h1>Will you be my Valentine? 💖</h1>
        <p>(Choose wisely... the NO button is shy 😊)</p>

        <button id="yesBtn" onclick="sayYes()">YES! 💘</button>
        <button id="noBtn" onclick="moveNo()">No 😢</button>
    </div>

    <div id="loveBox">
        <h2>You just made my day! ✨</h2>
        <p>
            You're the most amazing person ever! 💖<br><br>
            I'm so lucky to have you as my Valentine! 💕<br><br>
            This is going to be the best Valentine's Day!
        </p>
        <button onclick="closeLove()">💕 Close 💕</button>
    </div>

    <script>
        function moveNo() {
            const button = document.getElementById("noBtn");

            const container = document.querySelector(".container");
            const containerRect = container.getBoundingClientRect();

            const maxX = containerRect.width - 120;
            const maxY = containerRect.height - 100;

            const x = Math.random() * maxX;
            const y = Math.random() * maxY;

            button.style.left = x + "px";
            button.style.top = y + "px";
            button.style.transform = "none";

            const messages = [
                "No 😢",
                "Wait... 🥺",
                "Are you sure? 💔",
                "Really? 😭",
                "Think again! 🙏"
            ];

            button.innerText = messages[Math.floor(Math.random() * messages.length)];
        }

        function sayYes() {
            document.getElementById("loveBox").style.display = "block";
        }

        function closeLove() {
            document.getElementById("loveBox").style.display = "none";
        }
    </script>

</body>
</html>
