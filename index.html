<!DOCTYPE html>
<html>
<head>
    <title>💌 A Special Question For You 💌</title>
    <style>
        body {
            margin: 0;
            background: #FFC0CB;
            font-family: Arial;
            text-align: center;
        }

        .header {
            background: #FF1493;
            padding: 25px;
            color: white;
            font-size: 20px;
        }

        .container {
            background: #FFE5EC;
            margin: 40px;
            padding: 40px;
            border-radius: 20px;
        }

        h1 {
            color: #C71585;
        }

        button {
            border: none;
            border-radius: 10px;
            cursor: pointer;
        }

        #yesBtn {
            background: #FF1493;
            color: white;
            padding: 15px 40px;
            font-size: 18px;
            margin: 20px;
        }

        #noBtn {
            background: #FFB6C1;
            padding: 10px 25px;
            position: absolute;
        }

        #loveBox {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: #FFE5EC;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 0 20px pink;
        }
    </style>
</head>
<body>

<div class="header">
    💖 ✨ 💕 ✨ 💖 ✨ 💕 ✨ 💖
</div>

<div class="container">
    <h1>Will you be my Valentine? 💖</h1>
    <p>(Choose wisely... the NO button is shy 😊)</p>

    <button id="yesBtn" onclick="sayYes()">YES! 💘</button>
    <button id="noBtn" onclick="moveNo()">No 😢</button>
</div>

<div id="loveBox">
    <h2>You just made my day! ✨</h2>
    <p>
        You're the most amazing person ever! 💖<br><br>
        I'm so lucky to have you as my Valentine! 💕<br><br>
        This is going to be the best Valentine's Day!
    </p>
    <button onclick="closeLove()">💕 Close 💕</button>
</div>

<script>
    function moveNo() {
        const button = document.getElementById("noBtn");

        const x = Math.random() * (window.innerWidth - 150);
        const y = Math.random() * (window.innerHeight - 100);

        button.style.left = x + "px";
        button.style.top = y + "px";

        const messages = ["No 😢", "Wait... 🥺", "Are you sure? 💔", "Really? 😭", "Think again! 🙏"];
        button.innerText = messages[Math.floor(Math.random() * messages.length)];
    }

    function sayYes() {
        document.getElementById("loveBox").style.display = "block";
    }

    function closeLove() {
        document.getElementById("loveBox").style.display = "none";
    }
</script>

</body>
</html>
